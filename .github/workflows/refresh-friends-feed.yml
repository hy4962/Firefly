name: Refresh Friends Feed

# 定时刷新朋友圈快照：抓取友链 RSS/Atom 写入
# src/data/friends-feed-snapshot.json 并提交。
# 提交推送到 HY 分支后，Vercel 检测到新提交会自动重新构建部署，朋友圈内容因此保持新鲜。
# 抓取失败不会报错——friends-feed.ts 会自动回退到旧快照。

on:
  schedule:
    # UTC 周五 22:00 = 北京时间周六 06:00，每周一次
    - cron: "0 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write # 自动提交快照需要写权限

concurrency:
  group: friends-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Refresh friends feed snapshot
        run: npx tsx scripts/refresh-friends-feed.ts

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/friends-feed-snapshot.json; then
            echo "No changes to commit."
          else
            git add src/data/friends-feed-snapshot.json
            git commit -m "chore: refresh friends feed snapshot"
            git push
          fi

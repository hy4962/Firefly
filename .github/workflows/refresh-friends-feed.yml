name: Refresh External Snapshots

# 定时刷新「外部数据快照」——目前两类，共用一次提交与一次构建：
#   1. 朋友圈：抓取友链 RSS/Atom 写入 src/data/friends-feed-snapshot.json
#   2. Steam 游戏库：调用 Steam Web API 写入 src/data/steam-snapshot.json
#      （需要仓库 Secret STEAM_API_KEY；未配置时脚本会跳过，不影响第 1 类）
# 提交推送到 HY 分支后，Cloudflare 检测到新提交会自动重新构建部署，内容因此保持新鲜。
# 抓取失败不会报错——friends-feed.ts / steam.astro 都会自动回退到旧快照。

on:
  schedule:
    # UTC 周五 22:00 = 北京时间周六 06:00，每周一次
    - cron: "0 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write # 自动提交快照需要写权限

concurrency:
  group: friends-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Refresh friends feed snapshot
        run: npx tsx scripts/refresh-friends-feed.ts

      - name: Refresh Steam library snapshot
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: npx tsx scripts/refresh-steam-snapshot.ts

      - name: Commit snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/friends-feed-snapshot.json src/data/steam-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh external snapshots"
            git push
          fi

# 茶室桥接 Worker
# 部署：npx wrangler deploy -c chat-bridge/wrangler.toml
# 密钥：npx wrangler secret put BRIDGE_TOKEN -c chat-bridge/wrangler.toml
# 点歌台音频代理签名（可选，不设则复用 BRIDGE_TOKEN）：
# npx wrangler secret put MUSIC_SECRET -c chat-bridge/wrangler.toml
# 站长 Matrix ID（可选，默认按房间 power_levels >= 50 判定）：
# OWNER_ID = "@uid01:matrix.0dm.cn"

name = "tea-bridge"
main = "worker.mjs"
compatibility_date = "2025-01-01"
account_id = "46bddb57cd2c87c1eab643c4e3179136"

# 自定义域：tea.9ll.uk 必须在 Cloudflare 托管的 9ll.uk 这个 Zone 下
routes = [{ pattern = "tea.9ll.uk", custom_domain = true }]

[vars]
MATRIX_HS = "https://matrix.0dm.cn"
ROOM_ID = "!CKQYQ95MT69FlskJmkcEbSmkd72I6CTgnf_nITckm4I"
SITE_NAME = "折腾进行时"
SITE_URL = "https://www.0dm.cn"
WALINE_API = "https://waline.0dm.cn"
INDEX_ROOM_ID = "!rrPkhRAMIwcCDHUpTC:matrix.0dm.cn"
ALLOW_ORIGINS = "https://www.0dm.cn,https://0dm.cn,https://www.9ll.uk,https://9ll.uk,http://localhost:4399,http://127.0.0.1:4399"


[observability]
enabled = true

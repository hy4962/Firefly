<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1e1e1e;
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 1.5;
    }
    pre {
      margin: 0;
      padding: 16px;
      background: #2d2d2d;
      border-radius: 8px;
      overflow-x: auto;
      color: #d4d4d4;
    }
    .keyword { color: #569cd6; }
    .string { color: #ce9178; }
    .comment { color: #6a9955; }
    .function { color: #dcdcaa; }
    .number { color: #b5cea8; }
    .type { color: #4ec9b0; }
  </style>
</head>
<body>
  <pre><code>postListLayout: {
  defaultMode: &quot;list&quot;,      // 默认列表模式
  mobileDefaultMode: &quot;grid&quot;, // 移动端用网格模式
  descriptionLines: 2,       // 摘要显示2行
  tagsPosition: &quot;bottom&quot;,    // 标签显示在底部
},</code></pre>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1e1e1e;
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 1.5;
    }
    pre {
      margin: 0;
      padding: 16px;
      background: #2d2d2d;
      border-radius: 8px;
      overflow-x: auto;
      color: #d4d4d4;
    }
    .keyword { color: #569cd6; }
    .string { color: #ce9178; }
    .comment { color: #6a9955; }
    .function { color: #dcdcaa; }
    .number { color: #b5cea8; }
    .type { color: #4ec9b0; }
  </style>
</head>
<body>
  <pre><code>meta: {
  showPublished: true,  // 发布日期
  showCategory: true,   // 分类
  showTags: true,       // 标签
  showWords: true,      // 字数
  showReadingTime: false, // 阅读时间
},</code></pre>
</body>
</html>

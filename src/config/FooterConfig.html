<div id="ff-uptime" class="ff-uptime">本站已运行 <b data-ff-up="d">0</b> 天 <b data-ff-up="h">0</b> 小时 <b data-ff-up="m">0</b> 分 <b data-ff-up="s">0</b> 秒</div>

<div id="ff-us" class="ff-us" hidden>
	<span class="ff-us-i">今日访客：<b data-ff-us="todayVisitors">0</b></span>
	<span class="ff-us-i">今日访问：<b data-ff-us="todayPageviews">0</b></span>
	<span class="ff-us-i">本站访客：<b data-ff-us="visitors">0</b></span>
	<span class="ff-us-i">本站访问：<b data-ff-us="pageviews">0</b></span>
</div>

<script>
	(function () {
		// ===== 运行时间 =====
		// 建站日期与 siteConfig.siteStartDate 保持一致，时区写死 +08:00
		// 是为了让访客身处任何时区算出来的天数都相同。
		var START_AT = new Date("2026-03-24T00:00:00+08:00").getTime();
		var uptimeRoot = document.getElementById("ff-uptime");

		if (uptimeRoot) {
			var uptimeTimer = null;
			var uptimeParts = {
				d: uptimeRoot.querySelector('[data-ff-up="d"]'),
				h: uptimeRoot.querySelector('[data-ff-up="h"]'),
				m: uptimeRoot.querySelector('[data-ff-up="m"]'),
				s: uptimeRoot.querySelector('[data-ff-up="s"]'),
			};

			var renderUptime = function () {
				var total = Math.max(0, Math.floor((Date.now() - START_AT) / 1000));
				var values = {
					d: Math.floor(total / 86400),
					h: Math.floor((total % 86400) / 3600),
					m: Math.floor((total % 3600) / 60),
					s: total % 60,
				};
				Object.keys(values).forEach(function (key) {
					if (uptimeParts[key]) uptimeParts[key].textContent = String(values[key]);
				});
			};

			var startUptime = function () {
				if (uptimeTimer) return;
				renderUptime();
				uptimeTimer = window.setInterval(renderUptime, 1000);
			};

			var stopUptime = function () {
				if (!uptimeTimer) return;
				window.clearInterval(uptimeTimer);
				uptimeTimer = null;
			};

			// 切到后台就停表，省电也省调度。
			document.addEventListener("visibilitychange", function () {
				if (document.hidden) stopUptime();
				else startUptime();
			});

			startUptime();
		}

		// ===== 访问统计 =====
		// 换 Umami 站点或分享链接时，只改下面两行即可。
		// SHARE_ID 取分享链接 https://umami.9ll.uk/share/XXXXXXXX 的最后一段。
		var API_BASE = "https://umami.9ll.uk";
		var SHARE_ID = "Z4DD4Y3q9CTFpBeM";

		var KEY_SHARE = "ff:umami:share";
		var KEY_STATS = "ff:umami:stats";
		var TTL_SHARE = 86400000; // 分享令牌缓存 24 小时
		var TTL_TODAY = 60000; // 今日数据缓存 60 秒
		var TTL_ALL = 300000; // 全站数据缓存 5 分钟
		var ANIM_MS = 900;
		var POLL_MS = 90000; // 停留期间每 90 秒静默刷新一次
		var MIN_GAP = 60000; // 两次刷新之间至少间隔 60 秒

		var root = document.getElementById("ff-us");
		if (!root) return;

		function readCache(key, tag, ttl) {
			try {
				var raw = localStorage.getItem(key);
				if (!raw) return null;
				var cached = JSON.parse(raw);
				if (
					cached &&
					cached.tag === tag &&
					typeof cached.timestamp === "number" &&
					Date.now() - cached.timestamp < ttl
				) {
					return cached.value;
				}
			} catch (error) {
				// localStorage 不可用（无痕模式等）时直接走网络请求。
			}
			return null;
		}

		function writeCache(key, tag, value) {
			try {
				localStorage.setItem(
					key,
					JSON.stringify({ tag: tag, timestamp: Date.now(), value: value }),
				);
			} catch (error) {
				// 写入失败不影响本次渲染。
			}
		}

		function formatNumber(value) {
			return new Intl.NumberFormat("zh-CN").format(Number(value) || 0);
		}

		function animateNumber(element, target) {
			var previous = Number(element.dataset.ffUsValue || 0);
			element.dataset.ffUsValue = String(target);
			var reduceMotion =
				window.matchMedia &&
				window.matchMedia("(prefers-reduced-motion: reduce)").matches;
			if (reduceMotion || previous === target) {
				element.textContent = formatNumber(target);
				return;
			}
			var startedAt = null;
			function tick(timestamp) {
				if (startedAt === null) startedAt = timestamp;
				var progress = Math.min(1, (timestamp - startedAt) / ANIM_MS);
				var eased = 1 - Math.pow(1 - progress, 3);
				element.textContent = formatNumber(
					Math.round(previous + (target - previous) * eased),
				);
				if (progress < 1) {
					requestAnimationFrame(tick);
				} else {
					element.textContent = formatNumber(target);
				}
			}
			requestAnimationFrame(tick);
		}

		function render(values) {
			Object.keys(values).forEach(function (name) {
				var target = Math.max(0, Math.round(Number(values[name]) || 0));
				var elements = root.querySelectorAll('[data-ff-us="' + name + '"]');
				for (var i = 0; i < elements.length; i += 1) {
					animateNumber(elements[i], target);
				}
			});
			root.hidden = false;
		}

		function fetchShare() {
			var cached = readCache(KEY_SHARE, SHARE_ID, TTL_SHARE);
			if (cached) return Promise.resolve(cached);
			return fetch(API_BASE + "/api/share/" + encodeURIComponent(SHARE_ID), {
				cache: "no-store",
			})
				.then(function (response) {
					if (!response.ok) throw new Error("share " + response.status);
					return response.json();
				})
				.then(function (data) {
					if (!data || !data.websiteId || !data.token) {
						throw new Error("invalid share payload");
					}
					writeCache(KEY_SHARE, SHARE_ID, data);
					return data;
				});
		}

		function fetchStats(share, startAt, scope, ttl, force) {
			var key = KEY_STATS + ":" + scope;
			var cached = force ? null : readCache(key, share.websiteId, ttl);
			if (cached) return Promise.resolve(cached);

			var url =
				API_BASE +
				"/api/websites/" +
				share.websiteId +
				"/stats?startAt=" +
				startAt +
				"&endAt=" +
				Date.now();

			return fetch(url, {
				headers: {
					"x-umami-share-token": share.token,
					"x-umami-share-context": "1",
				},
			})
				.then(function (response) {
					if (!response.ok) throw new Error("stats " + response.status);
					return response.json();
				})
				.then(function (data) {
					writeCache(key, share.websiteId, data);
					return data;
				});
		}

		var running = false;
		var lastRefreshAt = 0;

		function refresh(force) {
			if (running) return;
			if (force && Date.now() - lastRefreshAt < MIN_GAP) return;
			running = true;
			lastRefreshAt = Date.now();

			var dayStart = new Date();
			dayStart.setHours(0, 0, 0, 0);
			var todayStart = dayStart.getTime();

			fetchShare()
				.then(function (share) {
					return Promise.all([
						fetchStats(share, todayStart, "today:" + todayStart, TTL_TODAY, force),
						fetchStats(share, 0, "all", TTL_ALL, force),
					]);
				})
				.then(function (results) {
					var today = results[0] || {};
					var all = results[1] || {};
					render({
						todayVisitors: today.visitors,
						todayPageviews: today.pageviews,
						visitors: all.visitors,
						pageviews: all.pageviews,
					});
				})
				.catch(function (error) {
					// 拉取失败就保持整行隐藏，不在页脚留残骸。
					if (window.console && console.warn) {
						console.warn("[ff-umami] 页脚统计加载失败：", error);
					}
				})
				.then(function () {
					running = false;
				});
		}

		function boot() {
			if ("requestIdleCallback" in window) {
				requestIdleCallback(function () {
					refresh(false);
				}, { timeout: 3000 });
			} else {
				setTimeout(function () {
					refresh(false);
				}, 600);
			}

			// 页面长时间停留时静默刷新，切后台不请求。
			setInterval(function () {
				if (document.hidden) return;
				refresh(true);
			}, POLL_MS);

			document.addEventListener("visibilitychange", function () {
				if (!document.hidden) refresh(true);
			});
		}

		if (document.readyState === "complete") {
			boot();
		} else {
			window.addEventListener("load", boot, { once: true });
		}
	})();
</script>

<script>
	// ===== 页面增强脚本：按需加载 =====
	// 只有进到对应页面才去拉那页的脚本，其他页面只背这十几行。
	// 之所以放页脚全站引入：页脚在 #swup-container 之外，切页不会重跑，
	// 用它挂住 swup 事件，才能保证从首页无刷新跳进去时增强照样生效。
	// 以后哪页还要加同类增强，往 PAGE_SCRIPTS 里补一条就行。
	(function () {
		var PAGE_SCRIPTS = [
			{
				path: /^\/friends\/?$/,
				id: "ff-friend-covers-js",
				src: "/assets/js/friends-covers.js",
			},
			{
				// 友链页分区：把「博客社区」挪到下方独立一栏
				path: /^\/friends\/?$/,
				id: "ff-friend-sections-js",
				src: "/assets/js/friends-sections.js",
			},
			{
				path: /^\/booknav\/?$/,
				id: "ff-booknav-covers-js",
				src: "/assets/js/booknav-covers.js",
			},
			{
				// 「最近评论」：全站加载 —— 桌面挂右栏、移动端挂底部栏，挂载逻辑在 js 里
				path: /.*/,
				id: "ff-recent-comments-js",
				src: "/assets/js/recent-comments.js?v=5",
			},
			{
				// 搜索预热：全站加载 —— 空转时就起 pagefind 的 worker/wasm/索引，
				// 顺带把「回车 = 进第一条结果」补上（上游搜索框没有 Enter 处理）
				path: /.*/,
				id: "ff-search-warmup-js",
				src: "/assets/js/search-warmup.js?v=1",
			},
			{
				// 评论区「回复折叠」：全站加载 —— 每条评论下的回复默认展示 2 条，
				// 多出来的收在「展开更多」后面。没有 #waline 的页面自动空转。
				path: /.*/,
				id: "ff-comment-reply-collapse-js",
				src: "/assets/js/comment-reply-collapse.js?v=2",
			},
			{
				// 评论区「回复引用」：全站加载 —— 顺着 wl-reply-to 的锚点把被回复那条
				// 摘成引用块，免得只看到 `@昵称：` 却不知道在回哪句。
				path: /.*/,
				id: "ff-comment-reply-quote-js",
				src: "/assets/js/comment-reply-quote.js?v=3",
			},
			{
				// 动态页内嵌评论增强：把回复折叠 / 回复引用的样式与脚本代投进那个同源
				// iframe。之所以要代投：动态的评论跑在 /dynamic/comments/ 里，那个页面
				// 走 Layout、没有页脚 —— 上面两条全站脚本与样式压根到不了它，动态里的
				// 回复就成了全站唯一「不折叠、无引用」的评论区。
				path: /^\/dynamic\/?$/,
				id: "ff-dynamic-comment-enhance-js",
				src: "/assets/js/dynamic-comment-enhance.js?v=3",
			},
		];

		function loadPageScripts() {
			var pathname = window.location.pathname;
			for (var i = 0; i < PAGE_SCRIPTS.length; i++) {
				var entry = PAGE_SCRIPTS[i];
				if (!entry.path.test(pathname)) continue;
				if (document.getElementById(entry.id)) continue;
				var script = document.createElement("script");
				script.id = entry.id;
				script.src = entry.src;
				script.async = true;
				document.head.appendChild(script);
			}
		}

		document.addEventListener("astro:page-load", loadPageScripts);
		document.addEventListener("swup:page:view", loadPageScripts);
		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", loadPageScripts, { once: true });
		} else {
			loadPageScripts();
		}
	})();
</script>

<style>
	/* ===== 首页动态跑马灯 ===== */
	/* 默认不显示。只有 home-dynamic-bar.js 把它插进 #main-grid 的首位、
	   且拿到数据加上 .ff-dyn--ready 之后，才会在首页露出来 ——
	   所以脚本没加载时，不会在页脚位置留一条裸的滚动条。 */
	.ff-dyn {
		/* 作为 #main-grid 的 grid item 横跨全部列（把左右侧栏一起吃进来）；

		display: none;
		margin: 0;
	}
	body.is-home .ff-dyn.ff-dyn--ready {

	}
	/* 移动端：#main-grid 会变成 display:block（见 layout-styles.css 的 .mobile-no-sidebar），

	@media (max-width: 767px) {
		.ff-dyn {
			margin-bottom: 1rem;
		}
		.ff-dyn-inner {
			gap: 8px;
			padding: 8px 10px;

			padding: 5px 8px;

			height: 14px;

	.ff-dyn-inner {
		display: flex;
		align-items: center;
		gap: 12px;
		width: 100%;
		padding: 10px 12px;
	}
	.ff-dyn-badge,
	.ff-dyn-more {
		display: inline-flex;
		align-items: center;
		gap: 4px;
		flex-shrink: 0;
		padding: 6px 10px;

		background: var(--btn-regular-bg);

		line-height: 1;

		transition: background-color 150ms;
	}
	.ff-dyn-badge {
		color: var(--btn-content);
	}
	.ff-dyn-more {
		color: var(--primary);
	}
	.ff-dyn-badge:hover,
	.ff-dyn-more:hover {
		background: var(--btn-regular-bg-hover);
	}
	.ff-dyn-badge svg,
	.ff-dyn-more svg {
		width: 15px;
		height: 15px;
		fill: currentColor;
	}
	.ff-dyn-marquee {
		flex: 1 1 auto;
		min-width: 0;
		overflow: hidden;
		padding: 4px 0;
		border-radius: 8px;
		background: var(--btn-regular-bg);
		-webkit-mask-image: linear-gradient(90deg, transparent, #000 2rem, #000 calc(100% - 2rem), transparent);
		mask-image: linear-gradient(90deg, transparent, #000 2rem, #000 calc(100% - 2rem), transparent);
	}
	.ff-dyn-marquee:hover .ff-dyn-track--animate,
	.ff-dyn-marquee:focus-within .ff-dyn-track--animate {
		animation-play-state: paused;
	}
	.ff-dyn-track {
		display: flex;
		align-items: center;
		width: max-content;
	}
	.ff-dyn-track--animate {
		animation: ff-dyn-scroll var(--ff-dyn-duration, 40s) linear infinite;
		will-change: transform;
	}
	@keyframes ff-dyn-scroll {
		from {
			transform: translateX(0);
		}
		to {
			transform: translateX(-50%);
		}
	}
	.ff-dyn-group {

	.ff-dyn-link {

</style>

<script>
	// ===== 首页动态跑马灯：按需加载 =====
	// 只在首页才去拉 /assets/js/home-dynamic-bar.js，其他页面只背这十几行。
	// 放页脚全站引入的原因同友链预览：页脚在 #swup-container 之外，
	// 用它挂住 swup 事件，才能保证从别的页面无刷新跳回首页时照样初始化。
	// ⚠️ vercel.json 给 /assets/* 配了 30 天强缓存，改完那个 js 记得把下面的 v= 往上加，
	//    否则老访客拿到的还是旧文件。
	(function () {
		function loadDynamicBar() {
			if (!/^\/$/.test(window.location.pathname)) return;
			if (document.getElementById("ff-dynbar-js")) return;
			var script = document.createElement("script");
			script.id = "ff-dynbar-js";
			script.src = "/assets/js/home-dynamic-bar.js?v=1";
			script.async = true;
			document.head.appendChild(script);
		}
		document.addEventListener("astro:page-load", loadDynamicBar);
		document.addEventListener("swup:page:view", loadDynamicBar);
		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", loadDynamicBar, { once: true });
		} else {
			loadDynamicBar();
		}
	})();
</script>

<style>
	/* ===== 动态页 RSS 订阅入口（/dynamic/ 头部，位于「N 动态」左侧） ===== */

<script>
	// ===== 动态页 RSS 订阅入口：按需注入 =====
	// /dynamic/ 整页是上游文件不能改，这里在页脚（swup 容器之外）挂事件，
	// 只在动态页把 RSS 入口塞进「N 动态」计数 pill 的最前面，并给 head 补自动发现声明。
	// 注意：不能插成 .page-count 的兄弟节点——page-header 是两列 grid，
	// 多一个直接子元素会把「N 动态」挤到下一行。
	// 点击不用任何 JS 拦截：Swup 的 triggerWillOpenNewWindow 会跳过 [target="_blank"]，
	// 原生新标签页打开就是对的。之前用捕获阶段 preventDefault + window.open 兜底，
	// 结果脚本一旦被重复执行（dev HMR）就会一次点击开两个窗口，已删除。
	(() => {
		var RSS_PATH = "/dynamic/rss.xml";

		function ensureHeadLink() {
			if (document.getElementById("ff-dynrss-alt")) return;
			var link = document.createElement("link");
			link.id = "ff-dynrss-alt";
			link.rel = "alternate";
			link.type = "application/rss+xml";
			link.title = "站长动态 RSS";
			link.href = RSS_PATH;
			document.head.appendChild(link);
		}

		function mountRssButton() {
			if (!/^\/dynamic\/?$/.test(window.location.pathname)) return;
			ensureHeadLink();
			var header = document.querySelector(".page-header");
			if (!header) return;
			if (document.getElementById("ff-dynrss-btn")) return;
			var count = header.querySelector(".page-count");
			if (!count) return;
			var button = document.createElement("a");
			button.id = "ff-dynrss-btn";
			button.className = "ff-dynrss-btn";
			button.href = RSS_PATH;
			button.target = "_blank";
			button.rel = "noopener noreferrer";
			button.setAttribute("aria-label", "订阅 RSS 以随时偷窥站长日常");
			button.title = "订阅 RSS 以随时偷窥站长日常";
			button.innerHTML =
				'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27zm0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93z"/></svg><span>订阅RSS以随时偷窥站长日常</span>';
			// 塞成 pill 的第一个子元素 → RSS 入口排在「N 动态」左边
			count.insertBefore(button, count.firstChild);
		}

		function initDynamicRss() {
			mountRssButton();
		}
		document.addEventListener("astro:page-load", initDynamicRss);
		document.addEventListener("swup:page:view", initDynamicRss);
		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", initDynamicRss, { once: true });
		} else {
			initDynamicRss();
		}
	})();
</script>

<style id="ff-comment-style-quote">
	/* ===== 评论区「回复引用」=====
	   ⚠️ 同 ff-comment-style-collapse：id 是给动态页 iframe 克隆用的，别删。
	   回复块由 comment-reply-quote.js 插进 .wl-content 里、紧跟那行 `@昵称：` 之后。
	   样式同样写页脚（swup 容器之外，切页不丢；未分层压过主题 @layer）。 */

	.ff-rq {
		/* 两行截断：引用只是提示「在回哪句」，不该跟正文抢长度 */
		display: -webkit-box;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 2;
		overflow: hidden;
		box-sizing: border-box;
		width: 100%;
		margin: 0.3rem 0 0.35rem;
		padding: 0.15rem 0.5rem;
		border: none;
		border-left: 3px solid var(--primary);
		border-radius: 0 0.25rem 0.25rem 0;
		/* 默认不给底色（底色挪到正文上了，见下面），只留左边那根线 */
		background: transparent;
		color: var(--content-meta);
		font-family: inherit;
		font-size: 0.8125rem;
		line-height: 1.55;
		text-align: left;
		cursor: pointer;
		transition: background-color 150ms ease;
	}
	/* 悬停才浮一层浅底，提示这东西能点 */
	.ff-rq:hover {
		background: var(--btn-regular-bg);
	}
	/* 回复符号（U+21A9 ↩ + U+FE0E 文本变体，免得被当成 emoji 渲染）。
	   ⚠️ 用真实 <span> 而不是 ::before —— 实测在 <button> 上（且 display:-webkit-box
	   做两行截断）伪元素压根不生成，computed content 一直是 "normal"，换转义写法也一样。
	   符号本身在 js 里用 \u21A9\uFE0E 拼，不往源码里贴不可见字符。 */
	.ff-rq-icon {
		margin-right: 0.35em;
		color: var(--primary);
		opacity: 0.85;
	}

	/* Waline 原生那行「@某某：」不再显示 —— 引用块里已经写了回的是谁，
	   两行并排纯属重复。.wl-reply-to 只出现在二级回复里，顶层评论没有这行。 */
	.wl-reply-to {
		display: none;
	}

	/* 底色从引用块挪到回复正文上：引用只是一句提示，正文才是这条回复的主体。
	   用 :has 精确框住「带引用块的回复」，顶层评论和普通回复的正文一律不受影响。 */
	.wl-content:has(> .ff-rq) > div {
		padding: 0.4rem 0.7rem;
		border-radius: 0.5rem;
		background: var(--btn-regular-bg);
	}
	.ff-rq:focus-visible {
		outline: 2px solid var(--primary);
		outline-offset: 2px;
	}
	.ff-rq-nick {
		margin-right: 0.35em;
		font-weight: 700;
		color: var(--primary);
	}
	.ff-rq-text {
		color: var(--content-meta);
	}

	/* 点引用后，目标评论闪一下，不然滚过去也不知道该看哪条 */
	.wl-card-item.ff-rq-flash {
		border-radius: 0.5rem;
		animation: ff-rq-flash 1.9s ease;
	}
	@keyframes ff-rq-flash {
		0%,
		100% {
			background-color: transparent;
		}
		15%,
		55% {
			background-color: color-mix(in srgb, var(--primary) 14%, transparent);
		}
	}
	@media (prefers-reduced-motion: reduce) {
		.wl-card-item.ff-rq-flash {
			animation: none;
		}
	}
</style>
